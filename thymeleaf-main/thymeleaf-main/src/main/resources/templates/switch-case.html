<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>switch-case condition</title>
</head>
<body>
<h1>Switch Case Thymeleaf Attributes Demo :</h1>
<h1 th:text="${user.name}"></h1>
<div th:switch ="${user.role}">
    <p th:case="'ADMIN'">User is an Admin User</p>
    <p th:case="'USER'">User is an normal User</p>
    <p th:case="*">User is something else</p>
</div>

</body>
</html>
