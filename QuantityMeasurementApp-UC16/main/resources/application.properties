# Database Configuration
# Repository type: CACHE or DATABASE
repository.type=CACHE

# H2 Database Configuration (for development)
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:quantitymeasurement;DB_CLOSE_DELAY=-1;MODE=MySQL
database.username=sa
database.password=

# Connection Pool Configuration
database.pool.initial.size=5
database.pool.max.size=20
database.pool.timeout=30000

# MySQL Database Configuration (for future use)
# database.driver=com.mysql.cj.jdbc.Driver
# database.url=jdbc:mysql://localhost:3306/quantitymeasurement?useSSL=false&serverTimezone=UTC
# database.username=root
# database.password=password

# PostgreSQL Database Configuration (for future use)
# database.driver=org.postgresql.Driver
# database.url=jdbc:postgresql://localhost:5432/quantitymeasurement
# database.username=postgres
# database.password=password

# Logging Configuration
logging.level.com.app.quantitymeasurement=INFO
logging.level.org.h2=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
